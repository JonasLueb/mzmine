name: Java formatting

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  spotless:
    name: Spotless check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26.0.1'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Check Java formatting
        run: ./gradlew spotlessCheck
